[project]
name = "streetshift-data"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "Aziz Derbel", email = "az.derbel.tn@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "apify-client>=3.3.0",
    "elasticsearch>=9",
    "geopandas>=1.2.0",
    "jsonschema>=4.26.0",
    "moss==1.21.0",
    "osmnx>=2.1.1",
    "pdfplumber>=0.11.10",
    "pyproj>=3.8.0",
    "python-dotenv>=1.2.4",
    "requests>=2.34.2",
    "shapely>=2.2.0",
]

[project.scripts]
streetshift-data = "streetshift_data:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"
